#cloud-config
package_update: true
packages:
  - git
  - postgresql
  - postgresql-contrib
  - nginx
  - curl

write_files:
  - path: /etc/control-asistencia-backend.env
    owner: root:root
    permissions: "0600"
    content: |
      NODE_ENV=production
      PORT=3000
      DATABASE_URL=postgresql://${database_user}:${database_password}@127.0.0.1:5432/${database_name}
      JWT_SECRET=${jwt_secret}
      CLIENT_URL="*"
  - path: /etc/nginx/sites-available/control-asistencia-backend
    owner: root:root
    permissions: "0644"
    content: |
      server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location = / {
          default_type application/json;
          return 200 '{"status":"ok","service":"control-asistencia-backend"}';
        }

        location /api/ {
          proxy_pass http://127.0.0.1:3000/api/;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
      }
  - path: /etc/systemd/system/control-asistencia-backend.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Control de Asistencia Backend
      After=network-online.target postgresql.service
      Wants=network-online.target
      Requires=postgresql.service

      [Service]
      Type=simple
      User=${application_user}
      WorkingDirectory=/opt/backend
      EnvironmentFile=/etc/control-asistencia-backend.env
      ExecStart=/usr/bin/node /opt/backend/src/server.js
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

runcmd:
  - [ bash, -c, "id -u ${application_user} >/dev/null 2>&1 || useradd --create-home --shell /bin/bash ${application_user}" ]
  - [ bash, -c, "curl -fsSL https://deb.nodesource.com/setup_20.x | bash -" ]
  - [ apt-get, install, -y, nodejs ]
  - [ systemctl, enable, --now, postgresql ]
  - [ bash, -c, "PG_CONF=$(find /etc/postgresql -name postgresql.conf -print -quit); PG_HBA=$(find /etc/postgresql -name pg_hba.conf -print -quit); sed -i \"s/^#listen_addresses = 'localhost'/listen_addresses = '*'/\" \"$PG_CONF\"; printf '\\nhost ${database_name} ${database_user} ${vpc_cidr} scram-sha-256\\n' >> \"$PG_HBA\"; systemctl restart postgresql" ]
  - [ bash, -c, "if ! sudo -u postgres psql -tAc \"SELECT 1 FROM pg_roles WHERE rolname='${database_user}'\" | grep -q 1; then sudo -u postgres psql -v ON_ERROR_STOP=1 -c \"CREATE USER ${database_user} WITH PASSWORD '${database_password}';\"; fi" ]
  - [ bash, -c, "if ! sudo -u postgres psql -tAc \"SELECT 1 FROM pg_database WHERE datname='${database_name}'\" | grep -q 1; then sudo -u postgres psql -v ON_ERROR_STOP=1 -c \"CREATE DATABASE ${database_name} OWNER ${database_user};\"; fi" ]
  - [ bash, -c, "git clone --branch ${repository_branch} ${repository_url} /opt/backend" ]
  - [ bash, -c, "chown -R ${application_user}:${application_user} /opt/backend; cd /opt/backend; npm ci --omit=dev" ]
  - [ bash, -c, "sed '/^CREATE DATABASE /d;/^\\\\connect /d' /opt/backend/schema.sql > /tmp/control-asistencia-schema.sql; sudo -u postgres psql -v ON_ERROR_STOP=1 -d ${database_name} -f /tmp/control-asistencia-schema.sql" ]
  - [ bash, -c, "sudo -u postgres psql -v ON_ERROR_STOP=1 -d ${database_name} -c \"GRANT USAGE ON SCHEMA public TO ${database_user}; GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO ${database_user}; GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO ${database_user}; GRANT ALL PRIVILEGES ON ALL FUNCTIONS IN SCHEMA public TO ${database_user}; ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT ALL PRIVILEGES ON TABLES TO ${database_user}; ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT ALL PRIVILEGES ON SEQUENCES TO ${database_user};\"" ]
  - [ systemctl, daemon-reload ]
  - [ systemctl, enable, --now, control-asistencia-backend ]
  - [ bash, -c, "rm -f /etc/nginx/sites-enabled/default /etc/nginx/sites-enabled/control-asistencia-backend; ln -s /etc/nginx/sites-available/control-asistencia-backend /etc/nginx/sites-enabled/control-asistencia-backend; nginx -t" ]
  - [ systemctl, restart, nginx ]
  - [ systemctl, enable, nginx ]
