AWSTemplateFormatVersion: '2010-09-09'
Description: Modulo IAM - Rol y Perfil para conexion via AWS Systems Manager

Resources:
  RolConexionSSM:
    Type: AWS::IAM::Role
    Properties:
      RoleName: RolInstanciaSSM-Practica
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  PerfilInstanciaSSM:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: PerfilInstanciaSSM-Practica
      Roles:
        - !Ref RolConexionSSM

Outputs:
  InstanceProfileName:
    Description: Nombre del perfil de instancia para asociar a las EC2
    Value: !Ref PerfilInstanciaSSM