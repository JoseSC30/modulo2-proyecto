AWSTemplateFormatVersion: '2010-09-09'
Description: Modulo de Seguridad - Security Group base

Resources:
  MiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group administrado en stack anidado
      Tags:
        - Key: Name
          Value: cfn-practica-sg

Outputs:
  SecurityGroupId:
    Description: ID del Security Group creado
    Value: !Ref MiSecurityGroup