#cloud-config
write_files:
  - path: /etc/control-asistencia-backend.env
    owner: root:root
    permissions: "0600"
    content: |
      NODE_ENV=production
      PORT=3000
      DATABASE_URL=postgresql://${database_user}:${database_password}@${database_private_ip}:5432/${database_name}
      JWT_SECRET=${jwt_secret}
      CLIENT_URL=*
  - path: /etc/systemd/system/control-asistencia-backend.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Control de Asistencia Backend
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=${application_user}
      WorkingDirectory=/opt/backend
      EnvironmentFile=/etc/control-asistencia-backend.env
      ExecStart=/usr/bin/node /opt/backend/src/server.js
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  - path: /etc/nginx/sites-available/control-asistencia-backend
    owner: root:root
    permissions: "0644"
    content: |
      server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location = / {
          default_type application/json;
          return 200 '{"status":"ok","service":"control-asistencia-backend"}';
        }

        location /api/ {
          proxy_pass http://127.0.0.1:3000/api/;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api {
          proxy_pass http://127.0.0.1:3000/api;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
      }

runcmd:
  - [ bash, -c, "id -u ${application_user} >/dev/null 2>&1 || useradd --create-home --shell /bin/bash ${application_user}" ]
  - [ bash, -c, "until pg_isready --host=${database_private_ip} --port=5432 --dbname=${database_name} --username=${database_user}; do sleep 5; done" ]
  - [ bash, -c, "git clone --branch ${repository_branch} ${backend_repository} /opt/backend" ]
  - [ bash, -c, "chown -R ${application_user}:${application_user} /opt/backend; cd /opt/backend; npm ci --omit=dev" ]
  - [ systemctl, daemon-reload ]
  - [ systemctl, enable, --now, control-asistencia-backend ]
  - [ bash, -c, "rm -f /etc/nginx/sites-enabled/default; ln -sf /etc/nginx/sites-available/control-asistencia-backend /etc/nginx/sites-enabled/control-asistencia-backend; nginx -t" ]
  - [ systemctl, enable, --now, nginx ]
